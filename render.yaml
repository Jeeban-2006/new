services:
  - type: web
    name: web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_HOST
        fromService:
          type: web
          name: api
          property: host

  - type: web
    name: api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clinic_db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: clinic_db
    databaseName: clinic_db
    plan: free
